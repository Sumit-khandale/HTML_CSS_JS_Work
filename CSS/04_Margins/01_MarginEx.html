<!-- Example of margin  -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            margin-top: 20px;
            margin-bottom: 20px;
            margin-left: 20px;
            margin-right: 600px;
            border-style: inset;
            border-color: rgb(242, 112, 30);
            border-radius: 10px;
            text-align: center;
            font-size: 50px;
        }
    </style>
 </head>
 <body>
    <h1>This is example of margin</h1>
 </body>
 </html>
