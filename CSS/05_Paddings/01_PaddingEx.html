<!-- Example of padding -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            padding-left: 20px;
            padding-right: 25px;
            padding-top: 35px;
            padding-bottom: 34px;
            border-style: dashed;
            border-width: 5px;
            border-radius: 10px;
            margin-right: 600px;
            text-align: center;
            background-color: rgb(242, 217, 172);
            color: blue;
            font-size: 50px;
        }
    </style>
 </head>
 <body>
    <h1>This is padding example</h1>
 </body>
 </html>
