<!-- Example of Padding -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            padding: 25px 35px;
            border-style: outset;
            border-color: red;
            border-radius: 10px;
            margin-right: 600px;
            text-align: center;
        }
    </style>
 </head>
 <body>
    <h1>This is example of padding</h1>
 </body>
 </html>
