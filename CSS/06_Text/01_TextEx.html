<!-- Example of text property -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color: orange;
        }
        h1{
            color: black;
        }
    </style>
 </head>
 <body>
    <h1>Example of Text property</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Aspernatur consequatur dolore,
         ipsam maiores earum vero quisquam dolor voluptate nemo rerum repudiandae
          quibusdam debitis natus a inventore unde facilis nostrum perferendis.
    </p>
 </body>
 </html>
