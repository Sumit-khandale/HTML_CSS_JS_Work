<!-- Example of text properties -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            direction: rtl;
            font-size: 50px;
            color: red;
        }
        h2{
            direction: ltr;
            font-size: 50px;
            color: blue;
        }
    </style>
 </head>
 <body>
    <h1>This is example of text property</h1><hr>
    <h2>This is example of text property</h2><hr>
 </body>
 </html>
