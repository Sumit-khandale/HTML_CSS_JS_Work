<!-- Example of line-height -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            line-height: 50px;
        }
        p{
            line-height: 50px;
        }
    </style>
</head>
<body>
    <h1>I am heading</h1>
    <p>This is a paragraph</p>
</body>
</html>
