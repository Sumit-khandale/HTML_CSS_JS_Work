<!-- Example of font-size -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            font-style: italic;
        }
        h2{
            font-style: oblique;
        }
        p{
            /* font-weight: bold; */
            /* font-weight: lighter; */
            font-weight: bolder;
        }
    </style>
 </head>
 <body>
    <h1>This is heading one</h1>
    <h2>This is heading two</h2>
    <p>This is parageraph</p>
 </body>
 </html>
