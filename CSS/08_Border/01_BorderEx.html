<!-- Example of table border -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,tr,th,td{
            border: 1px solid;
            border-collapse: collapse;
            text-align: center;
            width: no;
        }
        table{
            width: 100%;
        }
        th{
            height: 30px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
    </style>
 </head>
 <body>
    <table>
        <tr>
            <th>Sr.No</th>
            <th>Name</th>
            <th>City</th>
            <th>Department</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Sam</td>
            <td>Pune</td>
            <td>CS</td>
        </tr>
    </table>
 </body>
 </html>
