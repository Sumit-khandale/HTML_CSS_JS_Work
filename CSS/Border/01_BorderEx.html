<!-- Example of css Border -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            border-style: dotted;
        }
        p{
            border-style: double;
        }
        h2{
            border-style: dashed;
        }
        h3{
            border-style: groove;
        }
        h4{
            border-style: inset;
        }
        h5{
            border-style: outset;
        }
        h6{
            border-style: ridge;
        }

    </style>
 </head>
 <body>
    <h1>This is Border Example</h1>
    <p>This is Activate Windows</p>
    <h2>This is border example</h2>
    <h3>This is border example</h3>
    <h4>This is border example</h4>
    <h5>This is border example</h5>
    <h6>This is border example</h6>
 </body>
 </html>
