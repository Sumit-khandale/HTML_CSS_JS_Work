<!-- Example of border width -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            border-style: dotted;
            border-width: 5px;
        }
        h2{
            border-style: dashed;
            border-width: medium;
        }
        h3{
            border-style: double;
            border-width: thin;
        }
        #h1{
            border-style: groove;
            border-width: 10px 20px;
        }
    </style>
 </head>
 <body>
    <h1>This is border width example</h1>
    <h2>This is border width example</h2>
    <h3>This is border width example</h3>
    <h1 id="h1">This is border width example</h1>
 </body>
 </html>
