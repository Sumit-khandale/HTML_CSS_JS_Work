<!-- Example of Border color -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #ex1{
            border-style: dashed;
            border-width: medium;
            border-color:rgb(red, green, blue);
        }
        #ex2{
            border-style: double;
            border-width: thin;
            border-color: orange;
        }
        #ex3{
            border-style: inset;
            border-width: 10px;
            border-color: blue;
        }
    </style>
 </head>
 <body>
    <h2 id="ex1">This is Border color example</h2>
    <h2 id="ex2">This is Border color example</h2>
    <h2 id="ex3">This is Border color example</h2>
 </body>
 </html>
