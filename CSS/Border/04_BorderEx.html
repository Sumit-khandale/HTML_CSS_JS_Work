<!-- Example of border sides -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #ex1{
            border-style: dotted solid double dashed;
        }
        #ex2{
            border-style: dashed solid double;
        }
        #ex3{
            border-style: double dotted solid groove;
        }
    </style>
 </head>
 <body>
    <h1 id="ex1">This is example of border sides</h1>
    <h1 id="ex2">This is example of border sides</h1>
    <h1 id="ex3">This is example of border sides</h1>
 </body>
 </html>
