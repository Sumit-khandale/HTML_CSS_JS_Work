<!-- Example of border rounded (radius) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #ex1{
            border-style: inset;
            border-radius: 5px;
            border-color: red;
        }
        #ex2{
            border-style: outset;
            border-radius: 10px;
            border-color: orange;
        }
        #ex3{
            border-style: dashed;
            border-radius: 20px;
            border-color: blue;
        }
    </style>
</head>
<body>
    <h1 id="ex1">This is example of Border radius</h1>
    <h1 id="ex2">This is example of Border radius</h1>
    <h1 id="ex3">This is example of Border radius</h1>
</body>
</html>
