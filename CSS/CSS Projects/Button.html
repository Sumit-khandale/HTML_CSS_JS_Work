<!DOCTYPE html>
<html>
<head>
  <style>
    .gradient-btn {
      padding: 10px 20px;
      font-size: 16px;
      background: white;
      border: 4px solid transparent;
      border-image: linear-gradient(to right, #f00, #f0f) 1;
      color: #000;
      cursor: pointer;
    }
    :hover.gradient-btn{
        background-color: orange;
    }
  </style>
</head>
<body>
  <button class="gradient-btn">Click Me</button>
</body>
</html>
