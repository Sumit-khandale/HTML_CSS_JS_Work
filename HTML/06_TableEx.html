#Example of colspan and rowspan
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colspan</title>
    <style>
        table {
            text-align: center;
        }
    </style>
</head>
<body>
    <table border="1">
        <tr>
            <td>HTML</td>
            <td colspan="2">HTML</td>
        </tr>
        <tr>
            <td>HTML</td>
            <td>HTML</td>
            <td>HTML</td>
        </tr>
        <tr>
            <td colspan="2">HTML</td>
            <td>HTML</td>
        </tr>
    </table>
</body>
</html>
