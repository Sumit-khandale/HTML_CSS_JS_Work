<!-- Example of Audio tag and Video tag -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        video{
            width: 500pxpx;
            height: 300px;
        }
    </style>
</head>
<body>
    <h1>Audio</h1>
    <audio controls="controls" autoplay="autoplay">
        
        <source src="Video/HAR_HAR_SHAMBHU_-RINGTONE_S(48k).mp3">
    </audio><br><br>
    <h1>Video</h1>
    <video controls="controls" autoplay="autoplay">
        
        <source src="Video/Video2.mp4">
    </video>
</body>
</html>
