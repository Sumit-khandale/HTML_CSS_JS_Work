<!-- Example of Figure tag and figcaptions -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        figure{
            border: 2px solid black;
            width: 250px;
            padding: 10px;
            text-align: center;
            background-color: rgb(233, 108, 210);
            box-shadow: 0px 4px 10px 4px;
        }
        body{
            background-color: aqua;
        }
    </style>
</head>
<body>
    <figure>
        <img src="Images/download.jpg" alt="images">
        <figcaption>
            <h2>Electronic PCB Board</h2>
        </figcaption>
    </figure>
</body>
</html>
