 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="15_style.css">
 </head>
 <body>
    <header>
        <div id="div4">
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">About</a></li>
                <li><a href="">Apply</a></li>
                <li><a href="">Contact</a></li>
            </ul>
        </div>
    </header>
    <div id="div1">
        <form>
            <h1>Registration Form</h1>
            <tr>
            <label for="name">First Name</label>
            <input type="text" name="name" placeholder="Enter the First Name" required>
            </tr><br><br>
            <tr>
                <label for="lname">Last Name</label>
                <input type="text" name="lname" placeholder="Enter the Last Name" required>
            </tr><br><br>
            <tr>
                <label for="mail">Email</label>
                <input type="email" name="mail" placeholder="Enter Email Address" required>
            </tr><br><br>
            <tr>
                <label for="dob">Date_of_Birth</label>
                <input type="date" name="dob" placeholder="Enter your date of birth" required>
            </tr><br><br>
            <tr>
                <label for="user">User_Name</label>
                <input type="text" name="user" placeholder="Create User Name" required>
            </tr><br><br>
            <tr>
                <label for="pwd">Password</label>
                <input type="Password" name="pwd" placeholder="Enter the Password" required>
            </tr><br><br>
            <tr>
                <button>Submit</button>
                <button>Reset</button>
            </tr>
                
        </form>
    </div>
        <div id="div2">
            <h1>Login Form</h1>
            <tr>
                <label for="user">UserName</label>
                <input type="text" name="user" placeholder="Enter your User Name" required>
            </tr><br><br>
            <tr>
                <label for="pwd">Password</label>
                <input type="password" name="pwd" placeholder="Enter Correct Password" required>
            </tr><br><br>
            <tr>
            <button id="bt">Login</button>
           </tr>
        </div>
        <div id="div3">
            <img src="Images/sumit.jpg" alt="images">
        </div>
 </body>
 </html>
