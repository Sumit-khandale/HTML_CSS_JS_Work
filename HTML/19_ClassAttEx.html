<!-- Example of Class Attribute -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example of Class Attribute</title>
    <style>
        p{
            color: tomato;
        }
    </style>
 </head>
 <body>
    <p class="high-light">This is High light paragraph</p>
    <p class="high-light">This is another High light paragraph</p>
 </body>
 </html>
